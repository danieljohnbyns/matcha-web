name: Build and push image

on:
  push:
    branches: [production]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/balancedfutures/matcha-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Swiftwave redeploy
        env:
          SWIFTWAVE_WEBHOOK_URL: ${{ secrets.SWIFTWAVE_WEBHOOK_URL }}
          SWIFTWAVE_WEBHOOK_SECRET: ${{ secrets.SWIFTWAVE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$SWIFTWAVE_WEBHOOK_URL" ]; then
            echo "SWIFTWAVE_WEBHOOK_URL not set; skipping redeploy."
            exit 0
          fi
          curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            ${SWIFTWAVE_WEBHOOK_SECRET:+-H "Authorization: Bearer $SWIFTWAVE_WEBHOOK_SECRET"} \
            -d '{"image":"'"$IMAGE"':latest","ref":"'"$GITHUB_SHA"'"}' \
            "$SWIFTWAVE_WEBHOOK_URL"