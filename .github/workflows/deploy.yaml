name: Sync main to production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Force push main to production and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          bun pm version patch --no-git-tag-version
          git add package.json
          git commit -m "chore: bump version for deployment"
          git push origin main:production --force
      - name: Trigger Deployment Webhook
        run: |
          curl -X POST http://13.213.91.227:4173/api/deploy \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_SECRET }}"
