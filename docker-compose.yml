services:
  web:
    image: ghcr.io/balancedfutures/matcha-web:latest
    restart: always
    ports:
      - "4173:4173"
    environment:
      - NODE_ENV=production

  webhook:
    image: ghcr.io/balancedfutures/matcha-web:latest
    restart: always
    ports:
      - "9000:9000"
    environment:
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
    # Override command to run listener
    command: ["bun", "scripts/webhook-listener.ts"]
